plugins {
    id 'java'
    id 'application'
}

group = 'com.github.v-slyusarev.warehouse-alerts'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'com.github.vslyusarev.warehousealerts:shared:1.0-SNAPSHOT'
    implementation 'io.projectreactor.netty:reactor-netty:1.4.0-M2'
    implementation "io.projectreactor.kafka:reactor-kafka:1.3.25"
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.github.vslyusarev.warehousealerts.warehouse.Main'
}

test {
    useJUnitPlatform()
}